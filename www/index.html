<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0"
    />
    <title>CodeMate</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="icons/site-logo-chess.svg" />

    <meta property="og:title" content="CodeMate" />

    <meta
      property="og:description"
      content="CodeMate HTML, CSS və JavaScript ilə hazırlanmış klassik şahmat oyunudur. Brauzerdə birbaşa oynana bilər, sadə və aydın interfeysə malikdir, həm yeni başlayanlar, həm də şahmat həvəskarları üçün uyğun təcrübə təqdim edir."
    />

    <meta
      property="og:image"
      content="https://chess-game-be7z.vercel.app/images/chess-picture.png"
    />

    <meta property="og:url" content="https://chess-game-be7z.vercel.app/" />

    <meta property="og:type" content="website" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- ══ ANA SƏHİFƏ ══ -->
    <div id="screen-menu" class="screen active">
      <div class="menu-wrap">
        <div class="menu-crown">
          <img src="icons/chess-logo.svg" alt="logo" />
        </div>
        <h1 class="menu-title">CodeMate</h1>
        <p class="menu-sub">Kompüterə qarşı oyna</p>
        <div class="menu-card">
          <div class="field">
            <label class="field-label">Oyun növü</label>
            <div class="segmented" id="seg-mode">
              <button class="seg-btn active" data-value="friendly">
                <img src="icons/friend-active.svg" alt="dostluq" />
                Dostluq
              </button>
              <button class="seg-btn" data-value="challenge">
                <img src="icons/sword-active.svg" alt="meydan oxuma" /> Meydan
                oxuma
              </button>
            </div>
            <p class="field-hint" id="mode-hint">
              Gedişləri geri/irəli almaq mümkündür.
            </p>
          </div>

          <div class="field">
            <label class="field-label">Səviyyə</label>
            <div class="segmented" id="seg-level">
              <button class="seg-btn" data-value="1">Zəif</button>
              <button class="seg-btn active" data-value="2">Orta</button>
              <button class="seg-btn" data-value="3">Güclü</button>
            </div>
          </div>

          <div class="field">
            <label class="field-label">Rəng</label>
            <div class="segmented" id="seg-color">
              <button class="seg-btn active" data-value="w">
                <img src="icons/secim-ag.svg" alt="ag" /> Ağ
              </button>
              <button class="seg-btn" data-value="b">
                <img src="icons/secim-qara.svg" alt="qara" /> Qara
              </button>
              <button class="seg-btn" data-value="r">
                <img src="icons/dice.svg" alt="tesadufi" /> Təsadüfi
              </button>
            </div>
          </div>

          <button id="btn-start" class="btn-primary">Oyuna Başla</button>
        </div>
      </div>
    </div>

    <!-- ══ OYUN SƏHİFƏSİ ══ -->
    <div id="screen-game" class="screen">
      <div class="game-wrap">
        <div class="gameLogo">
          <img src="icons/chess-logo.svg" alt="logo" class="game-logo" />
          <p class="game-title">CodeMate</p>
        </div>
        <!-- Top bar -->

        <div class="top-bar">
          <button id="btn-menu" class="icon-btn" title="Menyu">
            <img src="icons/back1.svg" alt="menyu" />
          </button>
          <div class="player-info">
            <span class="player-badge" id="badge-top">●</span>
            <span class="player-label" id="label-top">Bot</span>
          </div>
          <span id="game-message" class="game-msg">Hərəkət seçin.</span>
        </div>

        <!-- Move history -->
        <div class="moves-panel" id="moves-panel">
          <div class="moves-list" id="moves-list"></div>
        </div>
        <!-- Board — koordinatlar xananın içindədir -->
        <div class="board-shell">
          <div id="board" class="board"></div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
          <button id="btn-settings" class="icon-btn" title="Ayarlar">
            <img src="icons/settings.svg" alt="ayarlar" />
          </button>
          <div class="player-info">
            <span class="player-badge" id="badge-bottom">●</span>
            <span class="player-label" id="label-bottom">Sən</span>
          </div>

          <div class="top-bar-right">
            <button id="btn-resign" class="icon-btn danger" title="Təslim ol">
              <img src="icons/teslim.svg" alt="teslim ol" />
            </button>
            <button id="btn-undo" class="icon-btn" title="Geri al">
              <img src="icons/geri.svg" alt="geri al" />
            </button>
            <button id="btn-redo" class="icon-btn" title="İrəli al">
              <img src="icons/ireli.svg" alt="ireli" />
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ══ MODAL ══ -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal-box">
        <p id="modal-text"></p>
        <div id="modal-btns" class="modal-btns"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
